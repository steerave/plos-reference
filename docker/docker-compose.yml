# Paperless-ngx — minimal single-household configuration.
#
# Two containers: Paperless itself (SQLite-backed) and a Redis sidecar.
# Redis is a deliberate, named exception to the "fewer moving parts" rule
# in ARCHITECTURE.md: current Paperless-ngx (post-2.x) hard-requires Redis
# for the Django cache and Celery broker — there is no in-process fallback.
# We keep it as small as possible: alpine image, no auth, no persistent
# volume (cache and broker state are fine to lose on restart). Postgres is
# still excluded; SQLite is sufficient for one household.
#
# See ARCHITECTURE.md "The four runtime components" for context and
# EVOLUTION.md for why the original "no Redis" assumption changed.

services:
  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: plos-paperless
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      # Host port is configurable via PAPERLESS_HOST_PORT in .env. Container
      # always listens on 8000 internally. Defaults to 8000:8000.
      - "${PAPERLESS_HOST_PORT:-8000}:8000"
    environment:
      PAPERLESS_DBENGINE: sqlite
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_TIME_ZONE: America/Chicago
      PAPERLESS_OCR_LANGUAGE: eng
      # Windows + Docker Desktop bind mounts do not deliver inotify events to
      # the container, so Paperless's default consumer (which watches via
      # inotify) never sees host-side drops. Switching to polling mode at 10s
      # makes the consumer visit the consume folder on a timer instead.
      PAPERLESS_CONSUMER_POLLING: 10
      PAPERLESS_CONSUMER_POLLING_DELAY: 5
      PAPERLESS_CONSUMER_POLLING_RETRY_COUNT: 5
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: ${PAPERLESS_URL_PUBLIC:-http://localhost:8000}
      PAPERLESS_POST_CONSUME_SCRIPT: /usr/src/paperless/scripts/post_consume_hook.py
      PAPERLESS_URL_PUBLIC: ${PAPERLESS_URL_PUBLIC:-http://localhost:8000}
    volumes:
      - G:\plos-data\paperless\data:/usr/src/paperless/data
      - G:\plos-data\paperless\media:/usr/src/paperless/media
      - G:\plos-data\paperless\consume:/usr/src/paperless/consume
      - G:\plos-data\paperless\export:/usr/src/paperless/export
      - G:\plos-data\plos:/usr/src/paperless/plos
      - ../scripts:/usr/src/paperless/scripts:ro

  redis:
    image: redis:7-alpine
    container_name: plos-redis
    restart: unless-stopped
    # No port published to the host — Paperless reaches Redis on the
    # internal Docker network at redis:6379. No volume — the cache and
    # Celery broker state are intentionally ephemeral.
